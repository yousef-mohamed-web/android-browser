name: Optimized Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    name: Build optimized split APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build minified release APKs
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleRelease

      - name: Show APK sizes
        run: |
          find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f -print0 | while IFS= read -r -d '' apk; do
            du -h "$apk"
          done

      - name: Upload installable release APKs
        uses: actions/upload-artifact@v4
        with:
          name: GeckoBrowser-optimized-release-apks
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
