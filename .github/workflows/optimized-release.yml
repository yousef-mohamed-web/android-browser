name: Optimized Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build optimized split APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo "sdkmanager not found"; exit 1; fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build minified release APKs
        run: gradle --no-daemon --stacktrace clean assembleRelease

      - name: Show APK sizes
        run: |
          find app/build/outputs/apk/release -type f -name '*.apk' -print0 | while IFS= read -r -d '' apk; do
            du -h "$apk"
          done

      - name: Analyze APK size breakdown
        shell: bash
        run: |
          set -euo pipefail
          for apk in app/build/outputs/apk/release/*.apk; do
            [ -f "$apk" ] || continue
            echo "===== APK: $apk ====="
            echo "--- Largest packaged entries (uncompressed) ---"
            unzip -l "$apk" | awk 'NF >= 4 && $1 ~ /^[0-9]+$/ {print $1 " " $4}' | sort -nr | sed -n '1,25p'
            echo "--- Size by top-level directory ---"
            unzip -l "$apk" | awk 'NF >= 4 && $1 ~ /^[0-9]+$/ {n=split($4,a,"/"); key=a[1]; if (key != "") total[key]+=$1} END {for (k in total) printf "%12d %s\\n", total[k], k}' | sort -nr
            echo "--- Native libraries by ABI ---"
            unzip -l "$apk" | awk 'NF >= 4 && index($4, "lib/") == 1 {print $1 " " $4}' | sort -nr | sed -n '1,30p'
            echo
          done

      - name: Compress ARM64 APK and save it in the repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p downloads
          zip -9 -j downloads/NOVA-ARM64-deflate9.zip app/build/outputs/apk/release/app-arm64-v8a-release.apk
          echo "Compressed package size:"
          du -h downloads/NOVA-ARM64-deflate9.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/NOVA-ARM64-deflate9.zip
          if git diff --cached --quiet; then
            echo "Compressed APK is unchanged; no repository commit is needed."
          else
            git commit -m "Add compressed ARM64 APK [skip ci]"
            git push origin HEAD:main
          fi

      - name: Upload ARM64 release APK
        uses: actions/upload-artifact@v7
        with:
          name: GeckoBrowser-ARM64
          path: app/build/outputs/apk/release/app-arm64-v8a-release.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload ARMv7 release APK
        uses: actions/upload-artifact@v7
        with:
          name: GeckoBrowser-ARMv7
          path: app/build/outputs/apk/release/app-armeabi-v7a-release.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
