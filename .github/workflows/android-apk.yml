name: Android APK Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and extract project archive
        run: |
          test -f GeckoBrowser-source.zip
          unzip -q GeckoBrowser-source.zip -d .
          test -f GeckoBrowser/settings.gradle.kts
          test -f GeckoBrowser/app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
          yes | sdkmanager --licenses

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        working-directory: GeckoBrowser
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GeckoBrowser-debug-apk
          path: GeckoBrowser/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
