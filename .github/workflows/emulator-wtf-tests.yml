name: Emulator.wtf Android Tests

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-tests:
    name: Build and test GeckoBrowser on Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager was not found on the GitHub runner."
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install required Android SDK packages
        run: |
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Check Emulator.wtf API token
        env:
          EW_API_TOKEN: ${{ secrets.EW_API_TOKEN }}
        run: |
          if [ -z "$EW_API_TOKEN" ]; then
            echo "::error::Missing EW_API_TOKEN. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Build app and instrumentation test APKs
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Run tests on Emulator.wtf (Android 10 / API 29)
        uses: emulator-wtf/actions/run-tests@v1.2.6
        with:
          api-token: ${{ secrets.EW_API_TOKEN }}
          app: app/build/outputs/apk/debug/app-debug.apk
          test: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          devices: |
            model=Pixel2,version=29
          record-video: true
          timeout: 20m
          outputs-dir: build/emulator-wtf-results

      - name: Upload Emulator.wtf test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-wtf-test-results
          path: build/emulator-wtf-results
          if-no-files-found: ignore
          retention-days: 14
